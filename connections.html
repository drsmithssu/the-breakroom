<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connections — The Breakroom</title>
<style>
  :root{
    --yellow:#f9df6d; --green:#a0c35a; --blue:#b0c4ef; --purple:#ba81c5;
    --bg:#fafafa; --tile:#efefe6; --tile-selected:#5a594e; --text:#121212;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:16px;display:flex;justify-content:center;}
  .app{width:100%;max-width:560px;}
  header{text-align:center;margin-bottom:8px;}
  header h1{font-size:1.35rem;margin:8px 0 2px;}
  header p{margin:0 0 8px;color:#555;font-size:.9rem;}
  .backlink{display:inline-block;margin-bottom:4px;color:#3a5fa8;text-decoration:none;font-size:.85rem;}
  .divider{border-bottom:1px solid #ddd;margin:10px 0;}
  .instructions{text-align:center;font-size:.95rem;margin:6px 0 12px;}
  .weektag{display:inline-block;font-size:.75rem;background:#e8e8e8;border-radius:10px;padding:2px 10px;margin-bottom:6px;}
  .solved-area .group{border-radius:8px;padding:10px 8px;margin-bottom:8px;text-align:center;animation:pop .35s ease;}
  @keyframes pop{0%{transform:scale(.92);opacity:.4;}100%{transform:scale(1);opacity:1;}}
  .group .gname{font-weight:800;text-transform:uppercase;font-size:.85rem;letter-spacing:.02em;}
  .group .gwords{font-size:.9rem;margin-top:2px;}
  .group .grationale{font-size:.8rem;margin-top:6px;color:#222;background:rgba(255,255,255,.45);border-radius:6px;padding:6px 8px;text-align:left;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .tile{border:none;border-radius:8px;background:var(--tile);min-height:72px;padding:4px;font-weight:700;font-size:.82rem;text-transform:uppercase;cursor:pointer;color:var(--text);line-height:1.15;word-break:break-word;transition:transform .08s;}
  .tile:active{transform:scale(.95);}
  .tile.selected{background:var(--tile-selected);color:#fff;}
  .tile.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  .mistakes{text-align:center;margin:16px 0 6px;font-size:.9rem;color:#333;}
  .dots{display:inline-block;margin-left:6px;}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#5a594e;margin:0 3px;vertical-align:middle;transition:opacity .3s;}
  .dot.used{opacity:.15;}
  .controls{display:flex;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .controls button{padding:12px 20px;border-radius:24px;border:1px solid #121212;background:#fff;font-size:.95rem;cursor:pointer;}
  .controls button:disabled{opacity:.35;cursor:default;}
  .controls .primary{background:#121212;color:#fff;}
  .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#121212;color:#fff;padding:10px 18px;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:10;}
  .toast.show{opacity:1;}
  .endcard{text-align:center;padding:10px 0;}
  .endcard h2{margin:6px 0;}
  .emoji-grid{font-size:1.4rem;line-height:1.5;margin:10px 0;letter-spacing:2px;}
  .archive{margin-top:20px;}
  .archive h3{text-align:center;font-size:1rem;}
  .archive button{display:block;width:100%;padding:12px 14px;margin:8px 0;border:1px solid #121212;border-radius:10px;background:#fff;cursor:pointer;text-align:left;font-size:.95rem;}
  .notice{text-align:center;padding:30px 10px;font-size:1rem;color:#444;}
  footer{text-align:center;color:#999;font-size:.75rem;margin-top:22px;}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="backlink" href="index.html">← The Breakroom</a>
    <h1>🩺 Nursing Connections</h1>
    <p>Group four terms that share a connection</p>
  </header>
  <div class="divider"></div>
  <div id="screen"></div>
  <footer>Colors hint at difficulty: 🟡 easiest → 🟢 → 🔵 → 🟣 trickiest<br>New puzzle every Monday</footer>
</div>
<div class="toast" id="toast"></div>

<script src="puzzles-connections.js"></script>
<script>
"use strict";
const COLORS = {yellow:"var(--yellow)", green:"var(--green)", blue:"var(--blue)", purple:"var(--purple)"};
const EMOJI = {yellow:"🟨", green:"🟩", blue:"🟦", purple:"🟪"};
const PUZZLES = window.CONNECTIONS_PUZZLES || [];
const SETTINGS = window.BREAKROOM_SETTINGS || {archiveOpen:false};
const PREVIEW = new URLSearchParams(location.search).get("preview") === "all";

let state = null;
const screen = document.getElementById("screen");

function parseLocalDate(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y, m-1, d); // local midnight — flips over on the date itself
}
function fmtWeek(iso){
  return "Week of " + parseLocalDate(iso).toLocaleDateString(undefined,{month:"long",day:"numeric"});
}
function availablePuzzles(){
  const now = new Date();
  return PUZZLES.filter(p => parseLocalDate(p.weekOf) <= now)
                .sort((a,b) => a.weekOf < b.weekOf ? -1 : 1);
}
function currentPuzzle(){
  const avail = availablePuzzles();
  return avail.length ? avail[avail.length-1] : null;
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove("show"), 1800);
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function renderHome(){
  state = null;
  if(PREVIEW){
    let html = '<p class="instructions"><strong>Preview mode</strong> — all puzzles, including unreleased:</p><div class="archive">';
    PUZZLES.forEach((p,i)=>{ html += `<button onclick="startPuzzle(${i})"><strong>${fmtWeek(p.weekOf)}:</strong> ${p.title}</button>`; });
    html += "</div>";
    screen.innerHTML = html;
    return;
  }
  const cur = currentPuzzle();
  if(!cur){
    const first = PUZZLES.length ? PUZZLES.slice().sort((a,b)=>a.weekOf<b.weekOf?-1:1)[0] : null;
    screen.innerHTML = `<div class="notice">The first puzzle arrives ${first ? "Monday, " + parseLocalDate(first.weekOf).toLocaleDateString(undefined,{month:"long",day:"numeric"}) : "soon"}.<br>Check back then! 🩺</div>`;
    return;
  }
  startPuzzle(PUZZLES.indexOf(cur));
}

function startPuzzle(idx){
  const puzzle = PUZZLES[idx];
  const tiles = [];
  puzzle.groups.forEach((g,gi)=>g.words.forEach(w=>tiles.push({word:w, group:gi})));
  state = {
    puzzle, idx,
    tiles: shuffle(tiles),
    selected: [],
    solved: [],
    mistakes: 0,
    maxMistakes: 4,
    guesses: [],
    guessedSets: new Set(),
    over: false
  };
  renderBoard();
}

function renderBoard(){
  const s = state, p = s.puzzle;
  let html = `<p class="instructions"><span class="weektag">${fmtWeek(p.weekOf)}</span><br><strong>${p.title}</strong><br>Create four groups of four!</p>`;
  html += '<div class="solved-area">';
  s.solved.forEach(gi=>{
    const g = p.groups[gi];
    html += `<div class="group" style="background:${COLORS[g.color]}">
      <div class="gname">${g.name}</div>
      <div class="gwords">${g.words.join(", ")}</div>
      <div class="grationale">💡 ${g.rationale}</div></div>`;
  });
  html += "</div>";
  if(!s.over){
    html += '<div class="grid">';
    s.tiles.forEach((t,ti)=>{
      if(s.solved.includes(t.group)) return;
      const sel = s.selected.includes(ti) ? " selected" : "";
      html += `<button class="tile${sel}" onclick="toggleTile(${ti})">${t.word}</button>`;
    });
    html += "</div>";
    html += `<div class="mistakes">Mistakes remaining:<span class="dots">`;
    for(let i=0;i<s.maxMistakes;i++) html += `<span class="dot${i < s.mistakes ? " used":""}"></span>`;
    html += `</span></div>`;
    html += `<div class="controls">
      <button onclick="shuffleTiles()">Shuffle</button>
      <button onclick="deselectAll()" ${s.selected.length? "":"disabled"}>Deselect</button>
      <button class="primary" onclick="submitGuess()" ${s.selected.length===4? "":"disabled"}>Submit</button>
    </div>`;
  } else {
    html += renderEnd();
  }
  screen.innerHTML = html;
  if(s.over) appendArchive();
}

function appendArchive(){
  if(PREVIEW){
    const back = document.createElement("div");
    back.innerHTML = `<div style="text-align:center;margin-top:10px;"><button class="backlink" style="background:none;border:none;cursor:pointer;text-decoration:underline;" onclick="renderHome()">← All puzzles (preview)</button></div>`;
    screen.appendChild(back);
    return;
  }
  if(!SETTINGS.archiveOpen) return;
  const avail = availablePuzzles();
  const cur = currentPuzzle();
  const past = avail.filter(p => p !== cur);
  if(!past.length) return;
  const div = document.createElement("div");
  div.className = "archive";
  let html = "<h3>🎉 The archive is open — play past weeks:</h3>";
  past.forEach(p=>{ html += `<button onclick="startPuzzle(${PUZZLES.indexOf(p)})"><strong>${fmtWeek(p.weekOf)}:</strong> ${p.title}</button>`; });
  div.innerHTML = html;
  screen.appendChild(div);
}

function toggleTile(ti){
  const s = state;
  const i = s.selected.indexOf(ti);
  if(i >= 0) s.selected.splice(i,1);
  else if(s.selected.length < 4) s.selected.push(ti);
  renderBoard();
}
function deselectAll(){ state.selected = []; renderBoard(); }
function shuffleTiles(){ shuffle(state.tiles); state.selected = []; renderBoard(); }

function submitGuess(){
  const s = state;
  if(s.selected.length !== 4) return;
  const groups = s.selected.map(ti=>s.tiles[ti].group);
  const key = s.selected.map(ti=>s.tiles[ti].word).sort().join("|");
  if(s.guessedSets.has(key)){ showToast("Already guessed!"); return; }
  s.guessedSets.add(key);
  s.guesses.push([...groups].sort());

  const counts = {};
  groups.forEach(g=>counts[g]=(counts[g]||0)+1);
  const best = Math.max(...Object.values(counts));

  if(best === 4){
    const gi = groups[0];
    s.solved.push(gi);
    s.selected = [];
    if(s.solved.length === 4){ s.over = true; s.won = true; }
    renderBoard();
  } else {
    if(best === 3) showToast("One away!");
    s.mistakes++;
    document.querySelectorAll(".tile.selected").forEach(el=>el.classList.add("shake"));
    if(s.mistakes >= s.maxMistakes){
      setTimeout(()=>{
        s.over = true; s.won = false;
        s.puzzle.groups.forEach((g,gi)=>{ if(!s.solved.includes(gi)) s.solved.push(gi); });
        renderBoard();
      }, 500);
    } else {
      setTimeout(()=>{ s.selected = []; renderBoard(); }, 500);
    }
  }
}

function shareText(){
  const s = state, p = s.puzzle;
  const colorsByGroup = p.groups.map(g=>EMOJI[g.color]);
  const grid = s.guesses.map(g=>g.map(gi=>colorsByGroup[gi]).join("")).join("\n");
  const result = s.won ? `Solved with ${s.mistakes} mistake${s.mistakes===1?"":"s"}` : "Didn't crack it this time";
  return `🩺 The Breakroom — Connections\n${fmtWeek(p.weekOf)}: ${p.title}\n${result}\n${grid}`;
}
function shareResults(){
  const text = shareText();
  const done = ()=>showToast("Copied! Paste it in your group chat 💬");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); done(); }
  catch(e){ showToast("Couldn't copy — screenshot instead!"); }
  document.body.removeChild(ta);
}

function renderEnd(){
  const s = state, p = s.puzzle;
  const colorsByGroup = p.groups.map(g=>EMOJI[g.color]);
  let grid = "";
  s.guesses.forEach(g=>{ grid += g.map(gi=>colorsByGroup[gi]).join("") + "<br>"; });
  const headline = s.won
    ? ["Perfect! 🎉","Great job! 🎉","Nicely done! 🎉","Phew — got there! 😅"][Math.min(s.mistakes,3)]
    : "Next time! 📚 Review the groups above.";
  return `<div class="endcard">
    <h2>${headline}</h2>
    <div class="emoji-grid">${grid}</div>
    <div class="controls">
      <button class="primary" onclick="shareResults()">Share Results 📋</button>
      <button onclick="startPuzzle(${s.idx})">Play Again</button>
    </div>
    <p style="font-size:.85rem;color:#666;">New puzzle Monday. See you then!</p>
  </div>`;
}

renderHome();
</script>
</body>
</html>
