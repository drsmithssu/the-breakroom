<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nursing Connections — ADN Level I</title>
<style>
  :root{
    --yellow:#f9df6d; --green:#a0c35a; --blue:#b0c4ef; --purple:#ba81c5;
    --bg:#fafafa; --tile:#efefe6; --tile-selected:#5a594e; --text:#121212;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:16px;display:flex;justify-content:center;}
  .app{width:100%;max-width:560px;}
  header{text-align:center;margin-bottom:8px;}
  header h1{font-size:1.35rem;margin:8px 0 2px;}
  header p{margin:0 0 8px;color:#555;font-size:.9rem;}
  .divider{border-bottom:1px solid #ddd;margin:10px 0;}
  /* Picker */
  .picker button{display:block;width:100%;padding:14px 16px;margin:10px 0;font-size:1rem;border:2px solid #121212;border-radius:12px;background:#fff;cursor:pointer;text-align:left;}
  .picker button:hover{background:#f0f0f0;}
  .picker .ptitle{font-weight:700;}
  .picker .psub{color:#666;font-size:.85rem;margin-top:2px;}
  .badge{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:10px;background:#e8e8e8;margin-left:6px;vertical-align:middle;}
  .badge.done{background:var(--green);}
  /* Board */
  .instructions{text-align:center;font-size:.95rem;margin:6px 0 12px;}
  .solved-area .group{border-radius:8px;padding:10px 8px;margin-bottom:8px;text-align:center;animation:pop .35s ease;}
  @keyframes pop{0%{transform:scale(.92);opacity:.4;}100%{transform:scale(1);opacity:1;}}
  .group .gname{font-weight:800;text-transform:uppercase;font-size:.85rem;letter-spacing:.02em;}
  .group .gwords{font-size:.9rem;margin-top:2px;}
  .group .grationale{font-size:.8rem;margin-top:6px;color:#222;background:rgba(255,255,255,.45);border-radius:6px;padding:6px 8px;text-align:left;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .tile{border:none;border-radius:8px;background:var(--tile);min-height:72px;padding:4px;font-weight:700;font-size:.82rem;text-transform:uppercase;cursor:pointer;color:var(--text);line-height:1.15;word-break:break-word;transition:transform .08s;}
  .tile:active{transform:scale(.95);}
  .tile.selected{background:var(--tile-selected);color:#fff;}
  .tile.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  .mistakes{text-align:center;margin:16px 0 6px;font-size:.9rem;color:#333;}
  .dots{display:inline-block;margin-left:6px;}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#5a594e;margin:0 3px;vertical-align:middle;transition:opacity .3s;}
  .dot.used{opacity:.15;}
  .controls{display:flex;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .controls button{padding:12px 20px;border-radius:24px;border:1px solid #121212;background:#fff;font-size:.95rem;cursor:pointer;}
  .controls button:disabled{opacity:.35;cursor:default;}
  .controls .primary{background:#121212;color:#fff;}
  .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#121212;color:#fff;padding:10px 18px;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:10;}
  .toast.show{opacity:1;}
  /* End screen */
  .endcard{text-align:center;padding:10px 0;}
  .endcard h2{margin:6px 0;}
  .emoji-grid{font-size:1.4rem;line-height:1.5;margin:10px 0;letter-spacing:2px;}
  .linkbtn{background:none;border:none;color:#3a5fa8;text-decoration:underline;cursor:pointer;font-size:.9rem;padding:6px;}
  footer{text-align:center;color:#999;font-size:.75rem;margin-top:22px;}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🩺 Nursing Connections</h1>
    <p>ADN Level I Review — group four terms that share a connection</p>
  </header>
  <div class="divider"></div>
  <div id="screen"></div>
  <footer>Colors hint at difficulty: 🟡 easiest → 🟢 → 🔵 → 🟣 trickiest</footer>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const PUZZLES = [
  {
    id:"vitals", title:"Puzzle 1: Vital Signs", subtitle:"Values, sites, and patterns",
    groups:[
      {name:"Normal Adult Vital Sign Values", color:"yellow",
       words:["98.6°F","60–100 bpm","12–20 /min","120/80 mmHg"],
       rationale:"Normal adult ranges: temperature ~98.6°F (37°C), heart rate 60–100 beats/min, respirations 12–20 breaths/min, and blood pressure around 120/80 mmHg."},
      {name:"Pulse Assessment Sites", color:"green",
       words:["Radial","Carotid","Brachial","Apical"],
       rationale:"Common pulse points: radial (wrist), carotid (neck — used in emergencies), brachial (inner arm — used for infants and BP), and apical (5th intercostal space, midclavicular line — auscultated for a full minute)."},
      {name:"Breathing Patterns", color:"blue",
       words:["Eupnea","Tachypnea","Bradypnea","Apnea"],
       rationale:"Eupnea = normal breathing; tachypnea = rate >20/min; bradypnea = rate <12/min; apnea = absence of breathing."},
      {name:"Blood Pressure Terms", color:"purple",
       words:["Systolic","Diastolic","Korotkoff","Orthostatic"],
       rationale:"Systolic = pressure during ventricular contraction; diastolic = pressure during relaxation; Korotkoff sounds are what you auscultate when measuring BP; orthostatic hypotension is a BP drop on standing (≥20 systolic or ≥10 diastolic)."}
    ]
  },
  {
    id:"precautions", title:"Puzzle 2: Infection Control", subtitle:"Sort by precaution type — watch for traps!",
    groups:[
      {name:"Personal Protective Equipment", color:"yellow",
       words:["Gloves","Gown","Mask","Goggles"],
       rationale:"Standard PPE items. Donning order: gown → mask → goggles → gloves. Doffing order: gloves → goggles → gown → mask."},
      {name:"Contact Precautions", color:"green",
       words:["MRSA","VRE","C. diff","Scabies"],
       rationale:"Spread by direct/indirect touch — gown and gloves required. For C. diff, wash hands with soap and water (alcohol rub does not kill spores)."},
      {name:"Droplet Precautions", color:"blue",
       words:["Influenza","Pertussis","Mumps","Rubella"],
       rationale:"Spread by large droplets within ~3–6 feet — wear a surgical mask; patient wears a mask during transport."},
      {name:"Airborne Precautions", color:"purple",
       words:["TB","Measles","Varicella","Dissem. zoster"],
       rationale:"Spread by small airborne particles — requires N95 respirator and negative-pressure room. Remember “My Chicken Hez TB”: Measles, Chickenpox (varicella), Herpes zoster (disseminated), TB."}
    ]
  },
  {
    id:"meds", title:"Puzzle 3: Med Administration & Math", subtitle:"Rights, routes, conversions, and abbreviations",
    groups:[
      {name:"“Rights” of Medication Administration", color:"yellow",
       words:["Patient","Drug","Dose","Time"],
       rationale:"Core rights of safe medication administration: right patient, drug, dose, time — plus route, documentation, reason, and the patient’s right to refuse."},
      {name:"Parenteral Routes", color:"green",
       words:["IV","IM","Subcut","Intradermal"],
       rationale:"Parenteral = bypasses the GI tract by injection: intravenous, intramuscular, subcutaneous, and intradermal (e.g., TB skin test). PO is NOT parenteral — it’s enteral."},
      {name:"Dosage Calculation Equivalents", color:"blue",
       words:["1 tsp = 5 mL","1 kg = 2.2 lb","1 oz = 30 mL","1 g = 1,000 mg"],
       rationale:"Must-memorize conversions for dosage calculation exams: 1 teaspoon = 5 mL, 1 kg = 2.2 lb, 1 ounce = 30 mL, 1 gram = 1,000 mg."},
      {name:"“Do Not Use” Abbreviations", color:"purple",
       words:["U","QD","MS","cc"],
       rationale:"Error-prone abbreviations: write “unit” not U, “daily” not QD, spell out morphine sulfate vs magnesium sulfate instead of MS, and use mL instead of cc."}
    ]
  },
  {
    id:"anp", title:"Puzzle 4: A&P Foundations", subtitle:"Structures and directional terms",
    groups:[
      {name:"Bones", color:"yellow",
       words:["Femur","Humerus","Sternum","Clavicle"],
       rationale:"Femur (thigh — longest bone), humerus (upper arm), sternum (breastbone), clavicle (collarbone)."},
      {name:"Heart Structures", color:"green",
       words:["Atrium","Ventricle","Aorta","Septum"],
       rationale:"Atria receive blood, ventricles pump it out, the aorta carries oxygenated blood from the left ventricle, and the septum divides right and left sides."},
      {name:"Parts of a Neuron", color:"blue",
       words:["Axon","Dendrite","Synapse","Myelin"],
       rationale:"Dendrites receive impulses, the axon carries them away from the cell body, myelin insulates and speeds conduction, and the synapse is the junction between neurons."},
      {name:"Anatomical Directional Terms", color:"purple",
       words:["Proximal","Distal","Medial","Lateral"],
       rationale:"Proximal = closer to the trunk/point of attachment; distal = farther away; medial = toward the midline; lateral = away from the midline."}
    ]
  },
  {
    id:"fundies", title:"Puzzle 5: Fundamentals Grab Bag", subtitle:"Frameworks every Level I student needs",
    groups:[
      {name:"Nursing Process Steps", color:"yellow",
       words:["Assessment","Diagnosis","Planning","Evaluation"],
       rationale:"ADPIE: Assessment, Diagnosis, Planning, Implementation, Evaluation. (Implementation is the missing step here!)"},
      {name:"Maslow’s Hierarchy Levels", color:"green",
       words:["Physiological","Safety","Belonging","Esteem"],
       rationale:"From the base up: physiological needs → safety → love/belonging → esteem → self-actualization. Physiological needs (airway, breathing, circulation) come first when prioritizing care."},
      {name:"Patient Positions", color:"blue",
       words:["Fowler’s","Supine","Prone","Sims’"],
       rationale:"Fowler’s = head of bed elevated (semi-Fowler’s 30–45°); supine = flat on back; prone = on abdomen; Sims’ = side-lying with upper leg flexed (used for enemas)."},
      {name:"Braden Scale Subscales", color:"purple",
       words:["Moisture","Activity","Mobility","Friction"],
       rationale:"The Braden Scale rates pressure-injury risk on six subscales: sensory perception, moisture, activity, mobility, nutrition, and friction/shear. Lower score = higher risk (≤18 = at risk)."}
    ]
  }
];

const COLORS = {yellow:"var(--yellow)", green:"var(--green)", blue:"var(--blue)", purple:"var(--purple)"};
const EMOJI = {yellow:"🟨", green:"🟩", blue:"🟦", purple:"🟪"};

let state = null;
const completed = {}; // puzzleId -> {won, guesses}
const screen = document.getElementById("screen");

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove("show"), 1800);
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function renderPicker(){
  state = null;
  let html = '<div class="picker"><p class="instructions">Choose a puzzle:</p>';
  PUZZLES.forEach((p,i)=>{
    const done = completed[p.id];
    const badge = done ? `<span class="badge done">${done.won ? "Solved ✓" : "Reviewed"}</span>` : "";
    html += `<button onclick="startPuzzle(${i})"><div class="ptitle">${p.title}${badge}</div><div class="psub">${p.subtitle}</div></button>`;
  });
  html += "</div>";
  screen.innerHTML = html;
}

function startPuzzle(idx){
  const puzzle = PUZZLES[idx];
  const tiles = [];
  puzzle.groups.forEach((g,gi)=>g.words.forEach(w=>tiles.push({word:w, group:gi})));
  state = {
    puzzle, idx,
    tiles: shuffle(tiles),
    selected: [],
    solved: [],          // group indices in solve order
    mistakes: 0,
    maxMistakes: 4,
    guesses: [],         // arrays of group indices per guess
    guessedSets: new Set(),
    over: false
  };
  renderBoard();
}

function renderBoard(){
  const s = state, p = s.puzzle;
  let html = `<p class="instructions"><strong>${p.title}</strong><br>Create four groups of four!</p>`;
  html += '<div class="solved-area">';
  s.solved.forEach(gi=>{
    const g = p.groups[gi];
    html += `<div class="group" style="background:${COLORS[g.color]}">
      <div class="gname">${g.name}</div>
      <div class="gwords">${g.words.join(", ")}</div>
      <div class="grationale">💡 ${g.rationale}</div></div>`;
  });
  html += "</div>";
  if(!s.over){
    html += '<div class="grid">';
    s.tiles.forEach((t,ti)=>{
      if(s.solved.includes(t.group)) return;
      const sel = s.selected.includes(ti) ? " selected" : "";
      html += `<button class="tile${sel}" data-ti="${ti}" onclick="toggleTile(${ti})">${t.word}</button>`;
    });
    html += "</div>";
    html += `<div class="mistakes">Mistakes remaining:<span class="dots">`;
    for(let i=0;i<s.maxMistakes;i++) html += `<span class="dot${i < s.mistakes ? " used":""}"></span>`;
    html += `</span></div>`;
    html += `<div class="controls">
      <button onclick="shuffleTiles()">Shuffle</button>
      <button onclick="deselectAll()" ${s.selected.length? "":"disabled"}>Deselect</button>
      <button class="primary" onclick="submitGuess()" ${s.selected.length===4? "":"disabled"}>Submit</button>
    </div>`;
    html += `<div style="text-align:center;margin-top:14px;"><button class="linkbtn" onclick="renderPicker()">← Back to puzzles</button></div>`;
  } else {
    html += renderEnd();
  }
  screen.innerHTML = html;
}

function toggleTile(ti){
  const s = state;
  const i = s.selected.indexOf(ti);
  if(i >= 0) s.selected.splice(i,1);
  else if(s.selected.length < 4) s.selected.push(ti);
  renderBoard();
}
function deselectAll(){ state.selected = []; renderBoard(); }
function shuffleTiles(){ shuffle(state.tiles); state.selected = []; renderBoard(); }

function submitGuess(){
  const s = state;
  if(s.selected.length !== 4) return;
  const groups = s.selected.map(ti=>s.tiles[ti].group);
  const key = s.selected.map(ti=>s.tiles[ti].word).sort().join("|");
  if(s.guessedSets.has(key)){ showToast("Already guessed!"); return; }
  s.guessedSets.add(key);
  s.guesses.push([...groups].sort());

  const counts = {};
  groups.forEach(g=>counts[g]=(counts[g]||0)+1);
  const best = Math.max(...Object.values(counts));

  if(best === 4){
    const gi = groups[0];
    s.solved.push(gi);
    s.selected = [];
    if(s.solved.length === 4){ s.over = true; s.won = true; finishPuzzle(); }
    renderBoard();
  } else {
    if(best === 3) showToast("One away!");
    s.mistakes++;
    document.querySelectorAll(".tile.selected").forEach(el=>el.classList.add("shake"));
    if(s.mistakes >= s.maxMistakes){
      setTimeout(()=>{
        s.over = true; s.won = false;
        // reveal remaining groups in order
        s.puzzle.groups.forEach((g,gi)=>{ if(!s.solved.includes(gi)) s.solved.push(gi); });
        finishPuzzle();
        renderBoard();
      }, 500);
    } else {
      setTimeout(()=>{ s.selected = []; renderBoard(); }, 500);
    }
  }
}

function finishPuzzle(){
  completed[state.puzzle.id] = {won: state.won, guesses: state.guesses};
}

function shareText(){
  const s = state, p = s.puzzle;
  const colorsByGroup = p.groups.map(g=>EMOJI[g.color]);
  const grid = s.guesses.map(g=>g.map(gi=>colorsByGroup[gi]).join("")).join("\n");
  const result = s.won ? `Solved with ${s.mistakes} mistake${s.mistakes===1?"":"s"}` : "Didn't crack it this time";
  return `🩺 Nursing Connections\n${p.title}\n${result}\n${grid}`;
}
function shareResults(){
  const text = shareText();
  const done = ()=>showToast("Copied! Paste it in your group chat 💬");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); done(); }
  catch(e){ showToast("Couldn't copy — screenshot instead!"); }
  document.body.removeChild(ta);
}
function renderEnd(){
  const s = state, p = s.puzzle;
  const colorsByGroup = p.groups.map(g=>EMOJI[g.color]);
  let grid = "";
  s.guesses.forEach(g=>{ grid += g.map(gi=>colorsByGroup[gi]).join("") + "<br>"; });
  const headline = s.won
    ? ["Perfect! 🎉","Great job! 🎉","Nicely done! 🎉","Phew — got there! 😅"][Math.min(s.mistakes,3)]
    : "Next time! 📚 Review the groups above.";
  return `<div class="endcard">
    <h2>${headline}</h2>
    <div class="emoji-grid">${grid}</div>
    <div class="controls">
      <button class="primary" onclick="shareResults()">Share Results 📋</button>
      <button onclick="startPuzzle(${s.idx})">Play Again</button>
      <button onclick="renderPicker()">All Puzzles</button>
    </div>
  </div>`;
}

renderPicker();
</script>
</body>
</html>
